[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Alternative-data terminal for Indian equities, built on SerpApi"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kairos-capture = "kairos.capture:main"

[tool.setuptools.packages.find]
include = ["kairos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
